services:
  tourism:
    build: .
    restart: unless-stopped
    read_only: true
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      PORT: 3000
      RATE_LIMIT: ${RATE_LIMIT:-120}
      DONATION_URL: ${DONATION_URL:-}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
